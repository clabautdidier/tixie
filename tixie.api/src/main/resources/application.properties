spring.application.name=tixie.api

# Database Verbinding (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/tixie
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate instellingen
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migratie
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Tixie Custom JWT Properties (worden ingelezen in JwtUtils)
# De secret moet minimaal 32 karakters zijn voor HS256!
tixie.jwt.secret=dit_is_een_zeer_geheim_en_lang_wachtwoord_voor_tixie_2026
tixie.jwt.expirationMs=3600000

# Server Port (optioneel, standaard 8080)
server.port=8080