<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Tixie Admin | User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-message { display: none; }
        /* Visuele indicatie voor verplichte velden */
        .form-label[required]::after {
            content: " *";
            color: red;
        }
    </style>
</head>
<body>
<div id="main-navbar"></div>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/navbar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Gebruikersbeheer</h1>
        <div class="d-flex gap-2">
            <input type="text" id="searchInput" class="form-control" placeholder="Zoek op naam..." style="width: 300px;">
            <button class="btn btn-success" onclick="prepareCreateModal()">Nieuwe Gebruiker</button>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th style="cursor: pointer" onclick="setSort('username')">Gebruikersnaam <span id="sort-username"></span></th>
                    <th style="cursor: pointer" onclick="setSort('fullName')">Naam <span id="sort-fullName"></span></th>
                    <th>Rollen</th>
                    <th>Status</th>
                    <th>Manager</th>
                    <th>Acties</th>
                </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="userForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Gebruiker</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="userModalError" class="alert alert-danger error-message"></div>

                    <input type="hidden" id="userId">

                    <div class="mb-3">
                        <label class="form-label" required>Gebruikersnaam</label>
                        <input type="text" id="newUsername" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" required>Email</label>
                        <input type="email" id="newEmail" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Volledige Naam</label>
                        <input type="text" id="newFullName" class="form-control">
                    </div>

                    <div id="passwordFieldsSection">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" required>Wachtwoord</label>
                                <input type="password" id="newPassword" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" required>Bevestig Wachtwoord</label>
                                <input type="password" id="confirmPassword" class="form-control">
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Manager</label>
                        <select id="newManager" class="form-select">
                            <option value="">Geen Manager</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" required>Rollen</label>
                        <select id="newRoles" class="form-select" multiple size="4" required>
                            <option value="ROLE_USER">USER</option>
                            <option value="ROLE_ADMIN">ADMIN</option>
                            <option value="ROLE_CONFIGADMIN">CONFIG ADMIN</option>
                            <option value="ROLE_CONFIGLOCATIONADMIN">LOCATION ADMIN</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuleren</button>
                    <button type="submit" class="btn btn-primary">Opslaan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="passwordForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title">Wachtwoord Wijzigen</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="passwordModalError" class="alert alert-danger error-message"></div>

                    <input type="hidden" id="passwordUserId">
                    <p>Wachtwoord wijzigen voor: <strong id="passwordDisplayUser"></strong></p>
                    <div class="mb-3">
                        <label class="form-label" required>Nieuw Wachtwoord</label>
                        <input type="password" id="modalPassword" class="form-control" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" required>Bevestig Wachtwoord</label>
                        <input type="password" id="modalPasswordConfirm" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-warning">Wijzigen</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    Auth.checkAuth();
    if (!Auth.hasRole('ROLE_ADMIN')) Auth.logout();

    let allUsers = [];
    let currentSort = { field: 'username', direction: 'asc' };
    let userModal;
    let passwordModal;

    document.addEventListener('DOMContentLoaded', () => {
        userModal = new bootstrap.Modal(document.getElementById('userModal'));
        passwordModal = new bootstrap.Modal(document.getElementById('passwordModal'));
        loadUsers();
    });

    function showError(elementId, message) {
        const errorElement = document.getElementById(elementId);
        errorElement.textContent = message;
        errorElement.style.display = 'block';
    }

    function clearErrors() {
        document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
    }

    async function loadUsers() {
        try {
            allUsers = await API.call('/users');
            renderTable();
        } catch (e) { console.error("Laden mislukt", e); }
    }

    function renderTable() {
        const tbody = document.getElementById('userTableBody');
        const search = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allUsers.filter(u => u.username.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));

        tbody.innerHTML = filtered.map(user => `
            <tr>
                <td>${user.username}</td>
                <td>${user.fullName || '-'}</td>
                <td>${user.roles.map(r => `<span class="badge bg-info text-dark me-1">${r.replace('ROLE_', '')}</span>`).join('')}</td>
                <td><span class="badge ${user.active ? 'bg-success' : 'bg-danger'}">${user.active ? 'Actief' : 'Inactief'}</span></td>
                <td>${user.managerName || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-primary me-1" onclick="editUser('${user.uuid}')">Bewerken</button>
                    <button class="btn btn-sm btn-warning" onclick="showPasswordModal('${user.uuid}')">Paswoord</button>
                </td>
            </tr>
        `).join('');
    }

    async function fillManagerDropdown() {
        const select = document.getElementById('newManager');
        const users = await API.call('/users');
        select.innerHTML = '<option value="">Geen Manager</option>';
        users.forEach(u => {
            const opt = document.createElement('option');
            opt.value = u.uuid;
            opt.textContent = u.username;
            select.appendChild(opt);
        });
    }

    async function prepareCreateModal() {
        clearErrors();
        document.getElementById('userForm').reset();
        document.getElementById('userId').value = '';
        document.getElementById('modalTitle').innerText = "Nieuwe Gebruiker";
        document.getElementById('newUsername').disabled = false;
        document.getElementById('passwordFieldsSection').classList.remove('d-none');
        await fillManagerDropdown();
        userModal.show();
    }

    async function editUser(uuid) {
        clearErrors();
        try {
            const user = await API.call(`/users/${uuid}`);
            document.getElementById('userId').value = user.uuid;
            document.getElementById('newUsername').value = user.username;
            document.getElementById('newUsername').disabled = true;
            document.getElementById('newEmail').value = user.email;
            document.getElementById('newFullName').value = user.fullName;

            await fillManagerDropdown();
            document.getElementById('newManager').value = user.managerUuid || "";
            document.getElementById('passwordFieldsSection').classList.add('d-none');

            const roleSelect = document.getElementById('newRoles');
            Array.from(roleSelect.options).forEach(opt => opt.selected = user.roles.includes(opt.value));

            userModal.show();
        } catch (e) { console.error(e); }
    }

    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const userId = document.getElementById('userId').value;
        const username = document.getElementById('newUsername');
        const email = document.getElementById('newEmail');
        const roles = document.getElementById('newRoles');
        const passwordValue = document.getElementById('newPassword');
        const confirmValue = document.getElementById('confirmPassword');

        let hasError = false;

        // Validatie verplichte velden
        if (!username.value) { username.classList.add('is-invalid'); hasError = true; }
        if (!email.value) { email.classList.add('is-invalid'); hasError = true; }
        if (roles.selectedOptions.length === 0) { roles.classList.add('is-invalid'); hasError = true; }

        if (!userId) {
            if (!passwordValue.value) { passwordValue.classList.add('is-invalid'); hasError = true; }
            if (passwordValue.value !== confirmValue.value) {
                confirmValue.classList.add('is-invalid');
                showError('userModalError', "Wachtwoorden komen niet overeen!");
                hasError = true;
            }
        }

        if (hasError) {
            if (!document.getElementById('userModalError').textContent) {
                showError('userModalError', "Vul alle verplichte velden in.");
            }
            return;
        }

        const userData = {
            username: username.value,
            email: email.value,
            fullName: document.getElementById('newFullName').value,
            roles: Array.from(roles.selectedOptions).map(o => o.value),
            managerUuid: document.getElementById('newManager').value || null
        };
        if (!userId) userData.password = passwordValue.value;

        try {
            await API.call(userId ? `/users/${userId}` : '/users', userId ? 'PUT' : 'POST', userData);
            userModal.hide();
            loadUsers();
        } catch (err) {
            showError('userModalError', "Fout bij opslaan: " + err.message);
        }
    });

    async function showPasswordModal(uuid) {
        clearErrors();
        const user = await API.call(`/users/${uuid}`);
        document.getElementById('passwordUserId').value = user.uuid;
        document.getElementById('passwordDisplayUser').innerText = user.username;
        document.getElementById('modalPassword').value = '';
        document.getElementById('modalPasswordConfirm').value = '';
        passwordModal.show();
    }

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const p1 = document.getElementById('modalPassword');
        const p2 = document.getElementById('modalPasswordConfirm');

        if (!p1.value || !p2.value) {
            showError('passwordModalError', "Beide velden zijn verplicht.");
            if(!p1.value) p1.classList.add('is-invalid');
            if(!p2.value) p2.classList.add('is-invalid');
            return;
        }

        if (p1.value !== p2.value) {
            showError('passwordModalError', "Wachtwoorden matchen niet.");
            p2.classList.add('is-invalid');
            return;
        }

        try {
            await API.call(`/users/${document.getElementById('passwordUserId').value}/password`, 'PUT', { password: p1.value });
            passwordModal.hide();
        } catch (err) { showError('passwordModalError', err.message); }
    });

    function setSort(field) {
        if (currentSort.field === field) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.field = field;
            currentSort.direction = 'asc';
        }
        renderTable();
    }
    document.getElementById('searchInput').addEventListener('input', renderTable);
</script>
</body>
</html>
