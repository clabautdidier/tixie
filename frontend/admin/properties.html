<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Tixie Admin | Property Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div id="main-navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Property Library</h1>
            <p class="text-muted">Definieer herbruikbare velden voor locaties en assets.</p>
        </div>
        <button class="btn btn-primary" onclick="openPropertyModal()">+ Nieuwe Eigenschap</button>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Naam</th>
                    <th>Type</th>
                    <th>Toepasbaar op</th>
                    <th class="text-end">Acties</th>
                </tr>
                </thead>
                <tbody id="propertyTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="propertyModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="propertyForm">
                <div class="modal-header">
                    <h5 class="modal-title">Eigenschap Definiëren</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="propertyUuid">
                    <div class="mb-3">
                        <label class="form-label">Naam *</label>
                        <input type="text" id="propertyName" class="form-control" required placeholder="bijv. IP Adres">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Datatype *</label>
                        <select id="propertyDataType" class="form-select" required>
                            <option value="TEXT">Tekst</option>
                            <option value="INTEGER">Geheel getal</option>
                            <option value="DECIMAL">Kommagetal</option>
                            <option value="DATE">Datum</option>
                            <option value="BOOLEAN">Boolean (Ja/Nee)</option>
                            <option value="EMAIL">Emailadres</option>
                            <option value="PHONE">Telefoonnummer</option>
                            <option value="USER_REF">Verwijzing naar Gebruiker</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Toepasbaar op: *</label>
                        <select id="propertyTarget" class="form-select" required>
                            <option value="ALL">Locaties & Items</option>
                            <option value="LOCATION">Enkel Locaties</option>
                            <option value="CONFIGURATION_ITEM">Enkel Configuration Items</option>
                        </select>
                        <div class="form-text">Bepaalt in welke schermen deze eigenschap gekoppeld kan worden.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuleren</button>
                    <button type="submit" class="btn btn-primary">Opslaan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/navbar.js"></script>
<script>
    let propertyModal;

    // Beveiliging
    Auth.checkAuth();
    if (!Auth.hasRole('ROLE_CONFIGLOCATIONADMIN') && !Auth.hasRole('ROLE_ADMIN')) {
        Auth.logout();
    }

    document.addEventListener('DOMContentLoaded', () => {
        propertyModal = new bootstrap.Modal(document.getElementById('propertyModal'));
        loadProperties();
    });

    async function loadProperties() {
        const properties = await API.call('/properties');
        const tbody = document.getElementById('propertyTableBody');
        tbody.innerHTML = properties.map(property => `
            <tr>
                <td><strong>${property.name}</strong></td>
                <td><span class="badge bg-info text-dark">${property.dataType}</span></td>
                <td>${formatTargetBadge(property.target)}</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-primary" onclick="editProperty('${property.uuid}')">
                        <i class="bi bi-pencil"></i> Bewerken
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function formatTargetBadge(target) {
        if (target === 'LOCATION') return '<span class="badge bg-secondary">Locaties</span>';
        if (target === 'CONFIGURATION_ITEM') return '<span class="badge bg-dark">Assets (CI)</span>';
        return '<span class="badge bg-primary">Beide</span>';
    }

    function openPropertyModal() {
        document.getElementById('propertyForm').reset();
        document.getElementById('propertyUuid').value = '';
        propertyModal.show();
    }

    async function editProperty(uuid) {
        // We halen de specifieke eigenschap op om zeker te zijn van de laatste data
        const property = await API.call(`/properties/${uuid}`);

        document.getElementById('propertyUuid').value = property.uuid;
        document.getElementById('propertyName').value = property.name;
        document.getElementById('propertyDataType').value = property.dataType;
        document.getElementById('propertyTarget').value = property.target || 'ALL';

        propertyModal.show();
    }

    document.getElementById('propertyForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const propertyUuid = document.getElementById('propertyUuid').value;
        const requestData = {
            name: document.getElementById('propertyName').value,
            dataType: document.getElementById('propertyDataType').value,
            target: document.getElementById('propertyTarget').value
        };

        const method = propertyUuid ? 'PUT' : 'POST';
        const url = propertyUuid ? `/properties/${propertyUuid}` : '/properties';

        try {
            await API.call(url, method, requestData);
            propertyModal.hide();
            loadProperties();
        } catch (error) {
            alert("Fout bij het opslaan: " + error.message);
        }
    });
</script>
</body>
</html>
