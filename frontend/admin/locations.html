<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Tixie Admin | Locations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/tree-view.css">
</head>
<body>
<div id="main-navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Locations</h1>
        <div class="d-flex gap-3">
            <div class="btn-group" role="group" aria-label="View Switcher">
                <button type="button" class="btn btn-outline-primary active" id="btnTableView" onclick="switchView('table')">
                    <i class="bi bi-table"></i> Tabel
                </button>
                <button type="button" class="btn btn-outline-primary" id="btnTreeView" onclick="switchView('tree')">
                    <i class="bi bi-tree-fill"></i> Boomstructuur
                </button>
            </div>
            <button class="btn btn-primary" onclick="openLocationModal()">
                <i class="bi bi-plus-lg"></i> Locatie Toevoegen
            </button>
        </div>
    </div>

    <div class="card mb-3 shadow-sm">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-8">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control" placeholder="Zoek op naam of type..." onkeyup="handleFilter()">
                    </div>
                </div>
                <div class="col-md-4">
                    <select id="sortSelect" class="form-select" onchange="handleSort()">
                        <option value="name_asc">Naam (A-Z)</option>
                        <option value="name_desc">Naam (Z-A)</option>
                        <option value="type_asc">Type (A-Z)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="tableView" class="view-container">
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Naam</th>
                        <th>Type</th>
                        <th>Parent</th>
                        <th class="text-end">Acties</th>
                    </tr>
                    </thead>
                    <tbody id="locationTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="treeView" class="view-container d-none">
        <div class="card shadow-sm">
            <div class="card-body">
                <div id="locationTreeContainer" class="tree-container"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="locationModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="locationForm">
                <div class="modal-header">
                    <h5 class="modal-title">Locatie Beheren</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="locUuid">

                    <div class="mb-3">
                        <label class="form-label">Naam *</label>
                        <input type="text" id="locName" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Type *</label>
                        <select id="locTypeSelect" class="form-select" required onchange="onTypeChange()">
                            <option value="">Selecteer een type...</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Parent Locatie</label>
                        <select id="locParentSelect" class="form-select">
                            <option value="">Geen (Hoofdniveau)</option>
                        </select>
                    </div>

                    <hr>
                    <div id="dynamicFieldsContainer">
                        <p class="text-muted small italic">Kies eerst een type om extra velden te zien.</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuleren</button>
                    <button type="submit" class="btn btn-primary">Opslaan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/navbar.js"></script>
<script>
    let locationModal;
    let locationTypes = [];
    let allLocations = [];
    let allTreeData = [];

    document.addEventListener('DOMContentLoaded', async () => {
        locationModal = new bootstrap.Modal(document.getElementById('locationModal'));
        await loadInitialData();
        await loadLocations();
        await loadLocationTree();
    });

    async function loadInitialData() {
        locationTypes = await API.call('/location-types');
        const typeSelect = document.getElementById('locTypeSelect');
        locationTypes.forEach(t => {
            const option = document.createElement('option');
            option.value = t.uuid;
            option.textContent = t.name;
            typeSelect.appendChild(option);
        });
    }

    async function loadLocations() {
        allLocations = await API.call('/locations');
        handleSort(); // Sorteert en rendert de tabel via handleFilter
    }

    async function loadLocationTree() {
        allTreeData = await API.call('/locations/tree');
        handleFilter();
    }

    function handleFilter() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();

        // Tabel filteren
        const filteredTable = allLocations.filter(l =>
            l.name.toLowerCase().includes(searchTerm) ||
            (l.typeName && l.typeName.toLowerCase().includes(searchTerm))
        );
        renderTable(filteredTable);

        // Boom filteren (Path Preserving)
        const filteredTree = filterTreeNodes(JSON.parse(JSON.stringify(allTreeData)), searchTerm);
        renderTree(filteredTree);
    }

    function filterTreeNodes(nodes, term) {
        return nodes.filter(node => {
            const matchesCurrent = node.name.toLowerCase().includes(term) ||
                node.locationTypeName.toLowerCase().includes(term);

            if (node.children && node.children.length > 0) {
                node.children = filterTreeNodes(node.children, term);
            }

            return matchesCurrent || (node.children && node.children.length > 0);
        });
    }

    function handleSort() {
        const sortValue = document.getElementById('sortSelect').value;
        allLocations.sort((a, b) => {
            if (sortValue === 'name_asc') return a.name.localeCompare(b.name);
            if (sortValue === 'name_desc') return b.name.localeCompare(a.name);
            if (sortValue === 'type_asc') return (a.typeName || '').localeCompare(b.typeName || '');
            return 0;
        });
        handleFilter();
    }

    function renderTable(data) {
        const tbody = document.getElementById('locationTableBody');
        tbody.innerHTML = data.map(l => `
            <tr>
                <td><strong>${l.name}</strong></td>
                <td><span class="badge bg-secondary">${l.typeName || 'N/A'}</span></td>
                <td>${l.parentName || '<span class="text-muted">-</span>'}</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-primary" onclick="editLocation('${l.uuid}')">Bewerken</button>
                </td>
            </tr>
        `).join('');
    }

    function renderTree(data) {
        const container = document.getElementById('locationTreeContainer');
        container.innerHTML = renderNodes(data);
    }

    function switchView(viewType) {
        document.getElementById('tableView').classList.toggle('d-none', viewType !== 'table');
        document.getElementById('treeView').classList.toggle('d-none', viewType !== 'tree');
        document.getElementById('btnTableView').classList.toggle('active', viewType === 'table');
        document.getElementById('btnTreeView').classList.toggle('active', viewType === 'tree');
    }

    function renderNodes(nodes) {
        if (!nodes || nodes.length === 0) return '';
        return `
    <ul class="list-group list-group-flush ms-4 mt-2">
        ${nodes.map(node => `
            <li class="list-group-item border-0 py-1">
                <div class="tree-row">
                    <div class="tree-content">
                        <i class="bi ${node.children && node.children.length > 0 ? 'bi-chevron-down' : 'bi-dot'} me-2 text-muted"></i>
                        <span class="fw-bold text-truncate">${node.name}</span>
                        <small class="badge bg-light text-dark ms-2 border">${node.locationTypeName}</small>
                    </div>

                    <div class="tree-actions opacity-75">
                        <button class="btn btn-sm btn-link text-success p-0"
                                onclick="openLocationModalWithParent('${node.uuid}')" title="Sublocatie toevoegen">
                            <i class="bi bi-plus-circle"></i>
                        </button>
                        <button class="btn btn-sm btn-link text-primary p-0"
                                onclick="editLocation('${node.uuid}')" title="Bewerken">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </div>
                </div>
                ${renderNodes(node.children)}
            </li>
        `).join('')}
    </ul>`;
    }

    async function refreshLocationParentDropdown(excludeUuid = null) {
        const treeData = await API.call('/locations/tree');
        const parentSelect = document.getElementById('locParentSelect');
        parentSelect.innerHTML = '<option value="">-- Geen Parent (Hoofdlocatie) --</option>';
        fillDropdownRecursive(treeData, parentSelect, 0, excludeUuid);
    }

    function fillDropdownRecursive(nodes, selectElement, level, excludeUuid) {
        if (!nodes) return;
        nodes.forEach(node => {
            if (node.uuid !== excludeUuid) {
                const option = document.createElement('option');
                option.value = node.uuid;
                const prefix = level > 0 ? '—'.repeat(level) + ' ' : '';
                option.textContent = prefix + node.name;
                selectElement.appendChild(option);
                if (node.children && node.children.length > 0) {
                    fillDropdownRecursive(node.children, selectElement, level + 1, excludeUuid);
                }
            }
        });
    }

    async function onTypeChange(existingValues = []) {
        const typeUuid = document.getElementById('locTypeSelect').value;
        const container = document.getElementById('dynamicFieldsContainer');
        container.innerHTML = '';
        if (!typeUuid) return;

        const type = locationTypes.find(t => t.uuid === typeUuid);
        if (!type || !type.properties || !type.properties.length) {
            container.innerHTML = '<p class="text-muted small">Geen extra velden voor dit type.</p>';
            return;
        }

        type.properties.forEach(prop => {
            const existing = existingValues.find(v => v.propertyUuid === prop.propertyUuid);
            const val = existing ? existing.value : '';
            let inputHtml = '';

            if (prop.dataType === 'BOOLEAN') {
                inputHtml = `<input type="checkbox" class="form-check-input dyn-input" data-uuid="${prop.propertyUuid}" ${val === 'true' ? 'checked' : ''}>`;
            } else if (prop.dataType === 'INTEGER') {
                inputHtml = `<input type="number" class="form-control dyn-input" data-uuid="${prop.propertyUuid}" value="${val}" ${prop.required ? 'required' : ''}>`;
            } else {
                inputHtml = `<input type="text" class="form-control dyn-input" data-uuid="${prop.propertyUuid}" value="${val}" ${prop.required ? 'required' : ''}>`;
            }

            container.innerHTML += `
                <div class="mb-3">
                    <label class="form-label">${prop.name} ${prop.required ? '<span class="text-danger">*</span>' : ''}</label>
                    <div class="${prop.dataType === 'BOOLEAN' ? 'form-check' : ''}">${inputHtml}</div>
                </div>`;
        });
    }

    async function openLocationModal() {
        document.getElementById('locationForm').reset();
        document.getElementById('locUuid').value = '';
        document.getElementById('dynamicFieldsContainer').innerHTML = '';
        await refreshLocationParentDropdown(null);
        locationModal.show();
    }

    async function openLocationModalWithParent(parentUuid) {
        await openLocationModal();
        document.getElementById('locParentSelect').value = parentUuid;
    }

    async function editLocation(uuid) {
        const loc = await API.call(`/locations/${uuid}`);
        await refreshLocationParentDropdown(loc.uuid);

        document.getElementById('locUuid').value = loc.uuid;
        document.getElementById('locName').value = loc.name;
        document.getElementById('locTypeSelect').value = loc.typeUuid;
        document.getElementById('locParentSelect').value = loc.parentUuid || '';

        await onTypeChange(loc.values || []);
        locationModal.show();
    }

    document.getElementById('locationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const values = [];
        document.querySelectorAll('.dyn-input').forEach(input => {
            let val = input.value;
            if (input.type === 'checkbox') val = input.checked.toString();
            values.push({ propertyUuid: input.dataset.uuid, value: val });
        });

        const data = {
            name: document.getElementById('locName').value,
            typeUuid: document.getElementById('locTypeSelect').value,
            parentUuid: document.getElementById('locParentSelect').value || null,
            values: values
        };

        const uuid = document.getElementById('locUuid').value;
        const method = uuid ? 'PUT' : 'POST';
        const url = uuid ? `/locations/${uuid}` : '/locations';

        await API.call(url, method, data);
        locationModal.hide();
        await loadLocations();
        await loadLocationTree();
    });
</script>
</body>
</html>
