<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Tixie Customer Portal | Mijn Incidenten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="main-navbar"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="./js/customer-navbar.js"></script>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Mijn Incidenten</h1>
        <a href="new-incident.html" class="btn btn-success">+ Nieuw Incident</a>
    </div>

    <div id="loadingMessage" class="text-center my-5">
        <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Laden...</span>
        </div>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>

    <div id="incidentsContainer" class="d-none">
        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Titel</th>
                            <th>Status</th>
                            <th>Prioriteit</th>
                            <th>Aangemaakt</th>
                            <th>Acties</th>
                        </tr>
                    </thead>
                    <tbody id="incidentsList">
                        <!-- Incidents worden hier geladen -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="emptyMessage" class="alert alert-info d-none">
        U heeft nog geen incidenten gemeld. <a href="new-incident.html">Meld uw eerste incident</a>.
    </div>
</div>

<script>
    // Beveilig de pagina
    Auth.checkAuth();

    // Laad incidenten
    async function loadIncidents() {
        const loadingDiv = document.getElementById('loadingMessage');
        const errorDiv = document.getElementById('errorMessage');
        const incidentsContainer = document.getElementById('incidentsContainer');
        const emptyMessage = document.getElementById('emptyMessage');
        const tbody = document.getElementById('incidentsList');

        try {
            const incidents = await API.call('/incidents', 'GET');
            
            loadingDiv.classList.add('d-none');
            
            if (!incidents || incidents.length === 0) {
                emptyMessage.classList.remove('d-none');
                return;
            }

            incidentsContainer.classList.remove('d-none');
            
            tbody.innerHTML = incidents.map(incident => {
                const statusBadge = getStatusBadge(incident.status);
                const priorityBadge = getPriorityBadge(incident.priority);
                const createdDate = new Date(incident.createdAt).toLocaleString('nl-NL');
                
                return `
                    <tr>
                        <td>${escapeHtml(incident.title)}</td>
                        <td>${statusBadge}</td>
                        <td>${priorityBadge}</td>
                        <td>${createdDate}</td>
                        <td>
                            <a href="incident-detail.html?uuid=${incident.uuid}" class="btn btn-sm btn-primary">Bekijken</a>
                        </td>
                    </tr>
                `;
            }).join('');
            
        } catch (err) {
            loadingDiv.classList.add('d-none');
            errorDiv.textContent = 'Fout bij het laden van incidenten: ' + err.message;
            errorDiv.classList.remove('d-none');
        }
    }

    function getStatusBadge(status) {
        const statusMap = {
            'OPEN': '<span class="badge bg-danger">Open</span>',
            'IN_PROGRESS': '<span class="badge bg-warning">In behandeling</span>',
            'RESOLVED': '<span class="badge bg-info">Opgelost</span>',
            'CLOSED': '<span class="badge bg-secondary">Gesloten</span>'
        };
        return statusMap[status] || status;
    }

    function getPriorityBadge(priority) {
        const priorityMap = {
            'LOW': '<span class="badge bg-secondary">Laag</span>',
            'MEDIUM': '<span class="badge bg-primary">Normaal</span>',
            'HIGH': '<span class="badge bg-warning">Hoog</span>',
            'CRITICAL': '<span class="badge bg-danger">Kritiek</span>'
        };
        return priorityMap[priority] || priority;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Laad de incidenten bij het laden van de pagina
    loadIncidents();
</script>
</body>
</html>
