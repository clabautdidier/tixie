<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Tixie Customer Portal | Profiel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/tree-view.css" rel="stylesheet">
</head>
<body class="bg-light">

<div id="main-navbar"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Mijn Profiel</h5>
                </div>
                <div class="card-body">
                    <form id="profileForm">
                        <div class="mb-3">
                            <label class="form-label">Gebruikersnaam</label>
                            <input type="text" id="username" class="form-control" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Volledige Naam</label>
                            <input type="text" id="fullName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Manager</label>
                            <input type="text" id="managerName" class="form-control" disabled value="Geen manager toegewezen">
                        </div>

                        <div id="profileError" class="alert alert-danger d-none"></div>
                        <div id="profileSuccess" class="alert alert-success d-none"></div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-success">Opslaan</button>
                            <button type="button" class="btn btn-secondary ms-2" onclick="window.history.back()">Sluiten</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="js/customer-navbar.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        await loadProfile();

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await updateProfile();
        });
    });

    async function loadProfile() {
        try {
            const user = await API.call('/users/me');
            document.getElementById('username').value = user.username;
            document.getElementById('fullName').value = user.fullName || '';
            document.getElementById('email').value = user.email || '';

            if (user.manager) {
                document.getElementById('managerName').value = user.manager.fullName || user.manager.username;
            }
        } catch (err) {
            console.error("Kon profiel niet laden", err);
        }
    }

    async function updateProfile() {
        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const errorDiv = document.getElementById('profileError');
        const successDiv = document.getElementById('profileSuccess');

        errorDiv.classList.add('d-none');
        successDiv.classList.add('d-none');

        try {
            await API.call('/users/me', 'PUT', {
                fullName,
                email
            });

            successDiv.textContent = "Profiel succesvol bijgewerkt.";
            successDiv.classList.remove('d-none');

            // Update display name in navbar if changed
            const user = Auth.getUser();
            // Note: In a real app we might need to refresh the token to update the name in the JWT
            // For now we just reload the page or update the UI manually if needed
        } catch (err) {
            errorDiv.textContent = err.message;
            errorDiv.classList.remove('d-none');
        }
    }
</script>
</body>
</html>
