<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Tixie Customer Portal | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="main-navbar"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="./js/customer-navbar.js"></script>

<div class="container mt-4">
    <h1>Welkom in het Customer Portaal</h1>
    <p id="welcomeMessage">Welkom terug!</p>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Mijn Incidenten</h5>
                </div>
                <div class="card-body">
                    <p>Bekijk en beheer uw incidentmeldingen.</p>
                    <a href="incidents.html" class="btn btn-success">Naar Incidenten</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">Nieuw Incident Melden</h5>
                </div>
                <div class="card-body">
                    <p>Meld een nieuw incident of probleem.</p>
                    <a href="new-incident.html" class="btn btn-info">Nieuw Incident</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Beveilig de pagina
    Auth.checkAuth();
    
    // Display welcome message
    const user = Auth.getUser();
    if (user) {
        const displayName = user.fullName || user.username;
        document.getElementById('welcomeMessage').textContent = `Welkom terug, ${displayName}!`;
    }
</script>
</body>
</html>
