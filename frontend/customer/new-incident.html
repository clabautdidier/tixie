<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Tixie Customer Portal | Nieuw Incident</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Quill CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link href="../assets/css/tree-view.css" rel="stylesheet">
    <style>
        .ql-editor {
            min-height: 150px;
        }
        /* Simple tree view styling */
        .tree-view ul {
            list-style-type: none;
            padding-left: 20px;
        }
        .tree-view li {
            margin: 2px 0;
        }
        .tree-view .caret {
            cursor: pointer;
            user-select: none;
            display: inline-block;
            width: 20px; /* Fixed width for alignment */
            text-align: center;
        }
        .tree-view .caret::before {
            content: "\25B6";
            color: black;
            display: inline-block;
        }
        .tree-view .caret-down::before {
            transform: rotate(90deg);
        }
        .tree-view .nested {
            display: none;
        }
        .tree-view .active {
            display: block;
        }
        .node-content {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .node-content:hover {
            background-color: #f8f9fa;
        }
        .selected-node {
            background-color: #e9ecef;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="main-navbar"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="./js/customer-navbar.js"></script>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Nieuw Incident Melden</h4>
                </div>
                <div class="card-body">
                    <form id="incidentForm">
                        <div class="mb-3">
                            <label for="title" class="form-label">Titel <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" required 
                                   placeholder="Korte beschrijving van het probleem">
                        </div>
                        
                        <div class="mb-3">
                            <label for="priority" class="form-label">Prioriteit <span class="text-danger">*</span></label>
                            <select class="form-select" id="priority" required>
                                <option value="LOW">Laag</option>
                                <option value="MEDIUM" selected>Normaal</option>
                                <option value="HIGH">Hoog</option>
                                <option value="CRITICAL">Kritiek</option>
                            </select>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Locatie</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="locationName" readonly placeholder="Selecteer een locatie...">
                                    <input type="hidden" id="locationUuid">
                                    <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#locationModal">Kies</button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Configuratie Item</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="ciName" readonly placeholder="Selecteer een item...">
                                    <input type="hidden" id="ciUuid">
                                    <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#ciModal">Kies</button>
                                </div>
                            </div>
                            <div class="form-text text-danger d-none" id="locationError">Vul minstens één van beide velden in (Locatie of Configuratie Item).</div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Beschrijving</label>
                            <div id="editor-container"></div>
                            <div class="form-text">Geef zoveel mogelijk details over het probleem zodat we u beter kunnen helpen.</div>
                        </div>
                        
                        <div id="errorMessage" class="alert alert-danger d-none"></div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="incidents.html" class="btn btn-secondary">Annuleren</a>
                            <button type="submit" class="btn btn-success" id="submitBtn">
                                Incident Melden
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Location Modal -->
<div class="modal fade" id="locationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Selecteer Locatie</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="locationTree" class="tree-view">Laden...</div>
            </div>
        </div>
    </div>
</div>

<!-- CI Modal -->
<div class="modal fade" id="ciModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Selecteer Configuratie Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="ciTree" class="tree-view">Laden...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Beveilig de pagina
    Auth.checkAuth();

    // Initialize Quill editor
    var quill = new Quill('#editor-container', {
        theme: 'snow',
        placeholder: 'Geef een gedetailleerde beschrijving van het probleem',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline', 'strike'],
                ['blockquote', 'code-block'],
                [{ 'header': 1 }, { 'header': 2 }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'script': 'sub'}, { 'script': 'super' }],
                [{ 'indent': '-1'}, { 'indent': '+1' }],
                [{ 'direction': 'rtl' }],
                [{ 'size': ['small', false, 'large', 'huge'] }],
                [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'font': [] }],
                [{ 'align': [] }],
                ['clean']
            ]
        }
    });

    // Tree View Logic
    function buildTree(nodes, containerId, onSelect, parentPath = '') {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        const ul = document.createElement('ul');

        nodes.forEach(node => {
            ul.appendChild(createTreeNode(node, onSelect, parentPath));
        });

        container.appendChild(ul);
    }

    function createTreeNode(node, onSelect, parentPath) {
        const li = document.createElement('li');
        const currentPath = parentPath ? `${parentPath} > ${node.name}` : node.name;

        // Flex container for the row
        const rowDiv = document.createElement('div');
        rowDiv.style.display = 'flex';
        rowDiv.style.alignItems = 'center';

        // Caret (expander)
        const caretSpan = document.createElement('span');
        if (node.children && node.children.length > 0) {
            caretSpan.classList.add('caret');
            caretSpan.onclick = (e) => {
                e.stopPropagation();
                const nested = li.querySelector('.nested');
                if (nested) nested.classList.toggle('active');
                caretSpan.classList.toggle('caret-down');
            };
        } else {
            // Spacer for leaf nodes
            caretSpan.style.display = 'inline-block';
            caretSpan.style.width = '20px';
        }
        rowDiv.appendChild(caretSpan);

        // Label (Content)
        const labelSpan = document.createElement('span');
        labelSpan.textContent = node.name;
        labelSpan.classList.add('node-content');

        // Only label click triggers selection
        labelSpan.onclick = (e) => {
            e.stopPropagation();
            // Remove selected class from all nodes in this tree
            const treeRoot = li.closest('.tree-view');
            treeRoot.querySelectorAll('.selected-node').forEach(el => el.classList.remove('selected-node'));
            labelSpan.classList.add('selected-node');
            onSelect(node, currentPath);
        };
        rowDiv.appendChild(labelSpan);

        li.appendChild(rowDiv);

        if (node.children && node.children.length > 0) {
            const nestedUl = document.createElement('ul');
            nestedUl.classList.add('nested');

            node.children.forEach(child => {
                nestedUl.appendChild(createTreeNode(child, onSelect, currentPath));
            });

            li.appendChild(nestedUl);
        }

        return li;
    }

    // Load Trees
    async function loadLocationTree() {
        try {
            const locations = await API.call('/locations/tree');
            buildTree(locations, 'locationTree', async (node, path) => {
                document.getElementById('locationName').value = path;
                document.getElementById('locationUuid').value = node.uuid;
                bootstrap.Modal.getInstance(document.getElementById('locationModal')).hide();

                // Clear CI selection when location changes
                document.getElementById('ciName').value = '';
                document.getElementById('ciUuid').value = '';

                // Reload CI tree filtered by location
                await loadCITree(node.uuid);
            });
        } catch (err) {
            console.error("Error loading location tree:", err);
        }
    }

    async function loadCITree(locationUuid = null) {
        try {
            const endpoint = locationUuid ? `/configuration-items/tree?locationUuid=${locationUuid}` : '/configuration-items/tree';
            const cis = await API.call(endpoint);
            buildTree(cis, 'ciTree', (node, path) => {
                document.getElementById('ciName').value = path;
                document.getElementById('ciUuid').value = node.uuid;
                bootstrap.Modal.getInstance(document.getElementById('ciModal')).hide();
            });
        } catch (err) {
            console.error("Error loading CI tree:", err);
        }
    }

    // Initial load
    loadLocationTree();
    loadCITree(); // Load all CIs initially

    document.getElementById('incidentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const errorDiv = document.getElementById('errorMessage');
        const locationError = document.getElementById('locationError');

        const locationUuid = document.getElementById('locationUuid').value;
        const ciUuid = document.getElementById('ciUuid').value;

        // Validate that at least one of location or configurationItem is filled
        if (!locationUuid && !ciUuid) {
            locationError.classList.remove('d-none');
            return;
        } else {
            locationError.classList.add('d-none');
        }

        // Disable submit button
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Bezig met versturen...';
        errorDiv.classList.add('d-none');
        
        const incidentData = {
            title: document.getElementById('title').value,
            priority: document.getElementById('priority').value,
            description: quill.root.innerHTML,
            locationUuid: locationUuid,
            configurationItemUuid: ciUuid
        };
        
        try {
            const result = await API.call('/incidents', 'POST', incidentData);
            window.location.href = `incident-detail.html?uuid=${result.uuid}`;
        } catch (err) {
            errorDiv.textContent = 'Fout bij het aanmaken van incident: ' + err.message;
            errorDiv.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Incident Melden';
        }
    });
</script>
</body>
</html>
