<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Tixie Customer Portal | Incident Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Quill CSS for consistent rendering of content -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link href="../assets/css/tree-view.css" rel="stylesheet">
    <style>
        .ql-editor {
            padding: 0;
            min-height: auto;
        }
        /* Override some Quill defaults that might conflict with Bootstrap or look odd in read-only mode */
        .ql-container.ql-snow {
            border: none;
        }
        /* Simple tree view styling */
        .tree-view ul {
            list-style-type: none;
            padding-left: 20px;
        }
        .tree-view li {
            margin: 2px 0;
        }
        .tree-view .caret {
            cursor: pointer;
            user-select: none;
            display: inline-block;
            width: 20px; /* Fixed width for alignment */
            text-align: center;
        }
        .tree-view .caret::before {
            content: "\25B6";
            color: black;
            display: inline-block;
        }
        .tree-view .caret-down::before {
            transform: rotate(90deg);
        }
        .tree-view .nested {
            display: none;
        }
        .tree-view .active {
            display: block;
        }
        .node-content {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .node-content:hover {
            background-color: #f8f9fa;
        }
        .selected-node {
            background-color: #e9ecef;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="main-navbar"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="./js/customer-navbar.js"></script>

<div class="container mt-4">
    <div class="mb-3">
        <a href="incidents.html" class="btn btn-secondary btn-sm">← Terug naar overzicht</a>
    </div>

    <div id="loadingMessage" class="text-center my-5">
        <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Laden...</span>
        </div>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>

    <div id="incidentDetail" class="d-none">
        <div class="card">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0" id="incidentTitle"></h4>
                <button id="editBtn" class="btn btn-light btn-sm d-none" onclick="enableEditMode()">Bewerken</button>
            </div>
            <div class="card-body">
                <form id="editForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p><strong>Status:</strong> <span id="incidentStatus"></span></p>
                        </div>
                        <div class="col-md-6">
                            <div id="priorityDisplay">
                                <strong>Prioriteit:</strong> <span id="incidentPriority"></span>
                            </div>
                            <div id="priorityEdit" class="d-none">
                                <label for="priorityInput" class="form-label"><strong>Prioriteit:</strong></label>
                                <select class="form-select" id="priorityInput">
                                    <option value="LOW">Laag</option>
                                    <option value="MEDIUM">Normaal</option>
                                    <option value="HIGH">Hoog</option>
                                    <option value="CRITICAL">Kritiek</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p><strong>Aangemaakt op:</strong> <span id="incidentCreatedAt"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Laatst bijgewerkt:</strong> <span id="incidentUpdatedAt"></span></p>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div id="locationDisplay">
                                <p><strong>Locatie:</strong> <span id="incidentLocation"></span></p>
                            </div>
                            <div id="locationEdit" class="d-none">
                                <label class="form-label"><strong>Locatie:</strong></label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="locationNameInput" readonly>
                                    <input type="hidden" id="locationUuidInput">
                                    <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#locationModal">Kies</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div id="ciDisplay">
                                <p><strong>Configuratie Item:</strong> <span id="incidentCI"></span></p>
                            </div>
                            <div id="ciEdit" class="d-none">
                                <label class="form-label"><strong>Configuratie Item:</strong></label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="ciNameInput" readonly>
                                    <input type="hidden" id="ciUuidInput">
                                    <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#ciModal">Kies</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-text text-danger d-none" id="locationError">Vul minstens één van beide velden in (Locatie of Configuratie Item).</div>
                        </div>
                    </div>

                    <div class="row mb-3" id="assignedToSection" style="display: none;">
                        <div class="col-md-12">
                            <p><strong>Toegewezen aan:</strong> <span id="incidentAssignedTo"></span></p>
                        </div>
                    </div>

                    <div id="titleEdit" class="mb-3 d-none">
                        <label for="titleInput" class="form-label"><strong>Titel:</strong></label>
                        <input type="text" class="form-control" id="titleInput">
                    </div>

                    <hr>

                    <div class="mb-3">
                        <h5>Beschrijving</h5>
                        <!-- Read-only view -->
                        <div id="descriptionDisplay" class="p-3 bg-light rounded ql-snow">
                            <div id="incidentDescription" class="ql-editor"></div>
                        </div>
                        <!-- Edit view -->
                        <div id="descriptionEdit" class="d-none">
                            <div id="editor-container"></div>
                        </div>
                    </div>

                    <div id="editActions" class="d-none mt-3">
                        <button type="button" class="btn btn-secondary" onclick="cancelEdit()">Annuleren</button>
                        <button type="submit" class="btn btn-success">Opslaan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Location Modal -->
<div class="modal fade" id="locationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Selecteer Locatie</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="locationTree" class="tree-view">Laden...</div>
            </div>
        </div>
    </div>
</div>

<!-- CI Modal -->
<div class="modal fade" id="ciModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Selecteer Configuratie Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="ciTree" class="tree-view">Laden...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Beveilig de pagina
    Auth.checkAuth();

    // Get UUID from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const incidentUuid = urlParams.get('uuid');

    if (!incidentUuid) {
        window.location.href = 'incidents.html';
    }

    let currentIncident = null;
    let quill = null;

    async function loadIncidentDetail() {
        const loadingDiv = document.getElementById('loadingMessage');
        const errorDiv = document.getElementById('errorMessage');
        const detailDiv = document.getElementById('incidentDetail');

        try {
            const incident = await API.call(`/incidents/${incidentUuid}`, 'GET');
            currentIncident = incident;

            loadingDiv.classList.add('d-none');
            detailDiv.classList.remove('d-none');
            
            // Populate the details
            document.getElementById('incidentTitle').textContent = incident.title;
            document.getElementById('incidentStatus').innerHTML = getStatusBadge(incident.status);
            document.getElementById('incidentPriority').innerHTML = getPriorityBadge(incident.priority);
            document.getElementById('incidentCreatedAt').textContent = new Date(incident.createdAt).toLocaleString('nl-NL');
            document.getElementById('incidentUpdatedAt').textContent = new Date(incident.updatedAt).toLocaleString('nl-NL');
            
            document.getElementById('incidentLocation').textContent = incident.locationPath || incident.locationName || '-';
            document.getElementById('incidentCI').textContent = incident.configurationItemPath || incident.configurationItemName || '-';

            if (incident.assignedToFullName) {
                document.getElementById('assignedToSection').style.display = 'block';
                document.getElementById('incidentAssignedTo').textContent = incident.assignedToFullName;
            }
            
            const descriptionDiv = document.getElementById('incidentDescription');
            if (incident.description) {
                descriptionDiv.innerHTML = incident.description;
            } else {
                descriptionDiv.innerHTML = '<em class="text-muted">Geen beschrijving</em>';
            }

            // Show edit button if status is OPEN
            if (incident.status === 'OPEN') {
                document.getElementById('editBtn').classList.remove('d-none');
            } else {
                document.getElementById('editBtn').classList.add('d-none');
            }
            
        } catch (err) {
            loadingDiv.classList.add('d-none');
            errorDiv.textContent = 'Fout bij het laden van incident: ' + err.message;
            errorDiv.classList.remove('d-none');
        }
    }

    // Tree View Logic
    function buildTree(nodes, containerId, onSelect, parentPath = '') {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        const ul = document.createElement('ul');

        nodes.forEach(node => {
            ul.appendChild(createTreeNode(node, onSelect, parentPath));
        });

        container.appendChild(ul);
    }

    function createTreeNode(node, onSelect, parentPath) {
        const li = document.createElement('li');
        const currentPath = parentPath ? `${parentPath} > ${node.name}` : node.name;

        // Flex container for the row
        const rowDiv = document.createElement('div');
        rowDiv.style.display = 'flex';
        rowDiv.style.alignItems = 'center';

        // Caret (expander)
        const caretSpan = document.createElement('span');
        if (node.children && node.children.length > 0) {
            caretSpan.classList.add('caret');
            caretSpan.onclick = (e) => {
                e.stopPropagation();
                const nested = li.querySelector('.nested');
                if (nested) nested.classList.toggle('active');
                caretSpan.classList.toggle('caret-down');
            };
        } else {
            // Spacer for leaf nodes
            caretSpan.style.display = 'inline-block';
            caretSpan.style.width = '20px';
        }
        rowDiv.appendChild(caretSpan);

        // Label (Content)
        const labelSpan = document.createElement('span');
        labelSpan.textContent = node.name;
        labelSpan.classList.add('node-content');

        // Only label click triggers selection
        labelSpan.onclick = (e) => {
            e.stopPropagation();
            // Remove selected class from all nodes in this tree
            const treeRoot = li.closest('.tree-view');
            treeRoot.querySelectorAll('.selected-node').forEach(el => el.classList.remove('selected-node'));
            labelSpan.classList.add('selected-node');
            onSelect(node, currentPath);
        };
        rowDiv.appendChild(labelSpan);

        li.appendChild(rowDiv);

        if (node.children && node.children.length > 0) {
            const nestedUl = document.createElement('ul');
            nestedUl.classList.add('nested');

            node.children.forEach(child => {
                nestedUl.appendChild(createTreeNode(child, onSelect, currentPath));
            });

            li.appendChild(nestedUl);
        }

        return li;
    }

    // Load Trees
    async function loadLocationTree() {
        try {
            const locations = await API.call('/locations/tree');
            buildTree(locations, 'locationTree', async (node, path) => {
                document.getElementById('locationNameInput').value = path;
                document.getElementById('locationUuidInput').value = node.uuid;
                bootstrap.Modal.getInstance(document.getElementById('locationModal')).hide();

                // Clear CI selection when location changes
                document.getElementById('ciNameInput').value = '';
                document.getElementById('ciUuidInput').value = '';

                // Reload CI tree filtered by location
                await loadCITree(node.uuid);
            });
        } catch (err) {
            console.error("Error loading location tree:", err);
        }
    }

    async function loadCITree(locationUuid = null) {
        try {
            const endpoint = locationUuid ? `/configuration-items/tree?locationUuid=${locationUuid}` : '/configuration-items/tree';
            const cis = await API.call(endpoint);
            buildTree(cis, 'ciTree', (node, path) => {
                document.getElementById('ciNameInput').value = path;
                document.getElementById('ciUuidInput').value = node.uuid;
                bootstrap.Modal.getInstance(document.getElementById('ciModal')).hide();
            });
        } catch (err) {
            console.error("Error loading CI tree:", err);
        }
    }

    function enableEditMode() {
        document.getElementById('editBtn').classList.add('d-none');
        document.getElementById('priorityDisplay').classList.add('d-none');
        document.getElementById('descriptionDisplay').classList.add('d-none');
        document.getElementById('incidentTitle').classList.add('d-none'); // Hide title in header
        document.getElementById('locationDisplay').classList.add('d-none');
        document.getElementById('ciDisplay').classList.add('d-none');

        document.getElementById('priorityEdit').classList.remove('d-none');
        document.getElementById('descriptionEdit').classList.remove('d-none');
        document.getElementById('titleEdit').classList.remove('d-none');
        document.getElementById('locationEdit').classList.remove('d-none');
        document.getElementById('ciEdit').classList.remove('d-none');
        document.getElementById('editActions').classList.remove('d-none');

        // Populate inputs
        document.getElementById('titleInput').value = currentIncident.title;
        document.getElementById('priorityInput').value = currentIncident.priority;
        document.getElementById('locationNameInput').value = currentIncident.locationPath || currentIncident.locationName || '';
        document.getElementById('locationUuidInput').value = currentIncident.locationUuid || '';
        document.getElementById('ciNameInput').value = currentIncident.configurationItemPath || currentIncident.configurationItemName || '';
        document.getElementById('ciUuidInput').value = currentIncident.configurationItemUuid || '';

        // Initialize Quill if not already done
        if (!quill) {
            quill = new Quill('#editor-container', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline', 'strike'],
                        ['blockquote', 'code-block'],
                        [{ 'header': 1 }, { 'header': 2 }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        [{ 'script': 'sub'}, { 'script': 'super' }],
                        [{ 'indent': '-1'}, { 'indent': '+1' }],
                        [{ 'direction': 'rtl' }],
                        [{ 'size': ['small', false, 'large', 'huge'] }],
                        [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'font': [] }],
                        [{ 'align': [] }],
                        ['clean']
                    ]
                }
            });
        }

        // Set Quill content
        if (currentIncident.description) {
            quill.root.innerHTML = currentIncident.description;
        }

        // Load trees for selection
        loadLocationTree();
        // If a location is already selected, filter CIs by it
        loadCITree(currentIncident.locationUuid);
    }

    function cancelEdit() {
        document.getElementById('editBtn').classList.remove('d-none');
        document.getElementById('priorityDisplay').classList.remove('d-none');
        document.getElementById('descriptionDisplay').classList.remove('d-none');
        document.getElementById('incidentTitle').classList.remove('d-none');
        document.getElementById('locationDisplay').classList.remove('d-none');
        document.getElementById('ciDisplay').classList.remove('d-none');

        document.getElementById('priorityEdit').classList.add('d-none');
        document.getElementById('descriptionEdit').classList.add('d-none');
        document.getElementById('titleEdit').classList.add('d-none');
        document.getElementById('locationEdit').classList.add('d-none');
        document.getElementById('ciEdit').classList.add('d-none');
        document.getElementById('editActions').classList.add('d-none');
        document.getElementById('locationError').classList.add('d-none');
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const errorDiv = document.getElementById('errorMessage');
        const locationError = document.getElementById('locationError');
        errorDiv.classList.add('d-none');

        const locationUuid = document.getElementById('locationUuidInput').value;
        const ciUuid = document.getElementById('ciUuidInput').value;

        // Validate that at least one of location or configurationItem is filled
        if (!locationUuid && !ciUuid) {
            locationError.classList.remove('d-none');
            return;
        } else {
            locationError.classList.add('d-none');
        }

        const updatedData = {
            title: document.getElementById('titleInput').value,
            priority: document.getElementById('priorityInput').value,
            description: quill.root.innerHTML,
            locationUuid: locationUuid,
            configurationItemUuid: ciUuid
        };

        try {
            await API.call(`/incidents/${incidentUuid}`, 'PUT', updatedData);

            // Reload details to show updated info and exit edit mode
            await loadIncidentDetail();
            cancelEdit();

        } catch (err) {
            errorDiv.textContent = 'Fout bij het bijwerken van incident: ' + err.message;
            errorDiv.classList.remove('d-none');
        }
    });

    function getStatusBadge(status) {
        const statusMap = {
            'OPEN': '<span class="badge bg-danger">Open</span>',
            'IN_PROGRESS': '<span class="badge bg-warning">In behandeling</span>',
            'RESOLVED': '<span class="badge bg-info">Opgelost</span>',
            'CLOSED': '<span class="badge bg-secondary">Gesloten</span>'
        };
        return statusMap[status] || status;
    }

    function getPriorityBadge(priority) {
        const priorityMap = {
            'LOW': '<span class="badge bg-secondary">Laag</span>',
            'MEDIUM': '<span class="badge bg-primary">Normaal</span>',
            'HIGH': '<span class="badge bg-warning">Hoog</span>',
            'CRITICAL': '<span class="badge bg-danger">Kritiek</span>'
        };
        return priorityMap[priority] || priority;
    }

    // Load incident when page loads
    loadIncidentDetail();
</script>
</body>
</html>
